name: Temel Analiz Verisi

# Temel veri ÇEYREKTE BİR değişir; bilanço sezonunda dağınık gelir.
# Haftada bir çalışır (Pazar 04:00 TR) — taze kalır, Actions dakikası yakmaz.
on:
  schedule:
    - cron: "0 1 * * 0"        # UTC 01:00 = TR 04:00, Pazar
  workflow_dispatch:

permissions:
  contents: write              # temel.json / sektor.json yazabilmek için

concurrency:
  group: temel-analiz
  cancel-in-progress: false    # yarıda kesilirse eksik dosya yazılmasın

jobs:
  temel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Çıkış kodu ne olursa olsun devam et; teşhis adımı sebebi yazsın.
      # Eskiden burada patlayıp hiçbir açıklama bırakmadan kırmızı yanıyordu.
      - name: Temel veriyi çek
        id: cek
        continue-on-error: true
        run: python temel-cek.py

      - name: Sonucu değerlendir
        id: kontrol
        run: |
          python - <<'PY'
          import json, os, sys

          def oku(dosya, anahtar):
              if not os.path.exists(dosya):
                  return 0, None
              try:
                  j = json.load(open(dosya, encoding="utf-8"))
              except Exception as e:
                  print("HATA " + dosya + ": " + str(e))
                  return 0, None
              h = j.get(anahtar) or {}
              return (len(h) if isinstance(h, dict) else 0), j.get("guncelleme")

          nt, gt = oku("temel.json", "hisse")
          ns, gs = oku("sektor.json", "sektor")
          print("temel.json  : " + str(nt) + " hisse · " + str(gt))
          print("sektor.json : " + str(ns) + " hisse · " + str(gs))

          # 50'nin altındaysa yazmaya degmez: worker eski dosyayi okumaya
          # devam etsin; yarim veriyle ustune yazmak daha kotudur.
          if nt < 50:
              print("")
              print("Yeterli kayit yok. En olasi sebepler:")
              print("  1) Yahoo cerez/crumb reddi - logda 'Yahoo oturumu' satiri var mi?")
              print("  2) Yahoo, GitHub Actions IP araligini engelliyor olabilir.")
              print("  3) havuz.json okunamadi - logun ilk satirina bak.")
              sys.exit(1)
          print("")
          print("dogrulandi")
          PY

      - name: Depoya yaz
        if: steps.kontrol.outcome == 'success'
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add temel.json
          if [ -f sektor.json ]; then git add sektor.json; fi
          if git diff --staged --quiet; then
            echo "Degisiklik yok."
          else
            git commit -m "temel.json + sektor.json guncellendi"
            git push
            echo "depoya yazildi"
          fi

      # Dosyalar depoya girmese bile indirilebilsin: elle inceleyip
      # nerede tikandigini gorebilirsin.
      - name: Ciktilari sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temel-cikti
          path: |
            temel.json
            sektor.json
          if-no-files-found: ignore
          retention-days: 7
