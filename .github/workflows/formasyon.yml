name: BIST Formasyon Taramasi

on:
  schedule:
    # Turkiye saati (UTC+3). BIST seansi 10:00-18:00.
    # Seans icinde 2 saatte bir + kapanistan sonra bir kez.
    - cron: "20 07 * * 1-5"   # 10:20
    - cron: "20 09 * * 1-5"   # 12:20
    - cron: "20 11 * * 1-5"   # 14:20
    - cron: "20 13 * * 1-5"   # 16:20
    - cron: "50 15 * * 1-5"   # 18:50  (kapanis sonrasi)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: formasyon
  cancel-in-progress: false

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet numpy
      - run: pip install --quiet borsapy financelib || echo "ek kutuphaneler kurulamadi, ana tarama yine de calisacak"
      - run: python tara.py --test
      - run: python tara.py
      - name: Yayinla
        run: |
          git config user.name formasyon-bot
          git config user.email actions@github.com
          git add formasyon.json
          git diff --staged --quiet || git commit -m "formasyon guncellendi"
          git pull --rebase --autostash || true
          git push
