name: BIST Formasyon Taramasi

on:
  schedule:
    # SINIRSIZ: gunun her saati, haftanin her gunu (hafta sonu dahil),
    # 8 dakikada bir. Onceki "sadece BIST seansi / hafta ici" kisitlamasi
    # kaldirildi -- artik hicbir zaman dilimi atlanmaz.
    - cron: "*/8 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: formasyon
  cancel-in-progress: false

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet numpy
      - run: pip install --quiet borsapy financelib || echo "ek kutuphaneler kurulamadi, ana tarama yine de calisacak"
      - run: python tara.py --test
      - run: python tara.py
      - name: Yayinla
        run: |
          git config user.name formasyon-bot
          git config user.email actions@github.com
          git add formasyon.json
          git diff --staged --quiet || git commit -m "formasyon guncellendi"
          git pull --rebase --autostash || true
          git push
          
