name: BIST Formasyon Taramasi

on:
  schedule:
    - cron: "45 15 * * 1-5"   # hafta ici 18:45 (Turkiye saati)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet numpy
      - run: python tara.py --test
      - run: python tara.py
      - name: Yayinla
        run: |
          git config user.name formasyon-bot
          git config user.email actions@github.com
          git add formasyon.json
          git diff --staged --quiet || git commit -m "formasyon guncellendi"
          git push
